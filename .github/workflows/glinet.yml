name: Build GL.iNet IP List

on:
  # ru.txt в v2fly/geoip обновляется примерно раз в месяц. Ежедневная
  # проверка почти всегда ничего не меняет: коммит появляется только
  # вместе с новыми данными источника.
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/glinet.yml'
      - 'scripts/extract_glinet.py'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout root repo
        uses: actions/checkout@v4

      - name: Build glinet-ip.txt
        run: |
          curl -sSfL "https://raw.githubusercontent.com/v2fly/geoip/release/text/ru.txt" -o ru.txt
          python3 scripts/extract_glinet.py ru.txt glinet-ip.txt
          rm ru.txt

      - name: Commit updated list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add glinet-ip.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: update GL.iNet IP list ($(date -u +%Y-%m-%d))"
            git push
          fi
